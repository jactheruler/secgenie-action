# Self-test: build the action from this checkout, scan the intentionally
# vulnerable files in fixtures/, and fail if Semgrep reports nothing.
# Uses a dummy OpenAI key: remediation calls fail gracefully, so this checks
# the scan/report pipeline without spending API credits.
name: SecGenie Self-Test

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SecGenie against fixtures
        id: secgenie
        uses: ./
        with:
          openai-api-key: dummy-key-for-self-test
          # Empty token: skip the PR comment so this job does not overwrite
          # the real SecGenie comment posted by secgenie.yml.
          github-token: ''

      - name: Assert findings were detected
        env:
          FINDINGS: ${{ steps.secgenie.outputs.findings-count }}
        run: |
          echo "SecGenie reported ${FINDINGS:-<unset>} finding(s)."
          if [ -z "$FINDINGS" ] || [ "$FINDINGS" -lt 1 ]; then
            echo "::error::Expected Semgrep findings in fixtures/vulnerable but got ${FINDINGS:-none}."
            exit 1
          fi
