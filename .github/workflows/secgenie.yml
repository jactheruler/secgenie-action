# Example consumer workflow: scan PRs targeting main with the published action.
# Requires repository secret OPENAI_API_KEY.
name: SecGenie Security Audit

on:
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Use ./ in this repository so CI runs the local action. Consumers should pin a tag.
      - name: Run SecGenie
        uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
