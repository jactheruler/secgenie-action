# Example consumer workflow: scan PRs targeting main with the published action.
# Requires repository secret OPENAI_API_KEY.
name: SecGenie Security Audit

on:
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pin a released tag of this action. For local iteration in this repo, use uses: ./
      - name: Run SecGenie
        uses: jactheruler/secgenie-action@v1.0.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
